# Hostinger VPS ke liye Nginx reverse proxy config
# Save as: /etc/nginx/sites-available/sathimate
# Enable  : ln -s /etc/nginx/sites-available/sathimate /etc/nginx/sites-enabled/
# SSL     : certbot --nginx -d sathimate.com -d www.sathimate.com
#           (certbot khud hi 443 block aur redirect add kar dega)

server {
    listen 80;
    listen [::]:80;
    server_name sathimate.com www.sathimate.com;

    client_max_body_size 12M;   # profile photo / image upload ke liye

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Next ke build assets — inka hash naam hota hai, isliye lamba cache safe hai
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # User ke upload kiye photos — inhe Nginx seedha disk se serve karta hai,
    # Node.js ko touch kiye bina. Ye Firebase Storage ki replacement hai.
    location /uploads/ {
        alias /var/www/sathimate-uploads/;
        add_header Cache-Control "public, max-age=2592000";
        # uploaded files ko kabhi execute mat hone dena
        location ~* \.(php|js|py|sh|cgi)$ { deny all; }
        try_files $uri =404;
    }

    # public/ folder ki images
    location /my-images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
